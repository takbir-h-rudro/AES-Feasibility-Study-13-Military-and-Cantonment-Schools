<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">Proposed structure breakdown</title>
<desc id="desc">Bar chart showing 15 academic and multipurpose structures, 10 auditoriums, 4 hostels, and 15 residential or supporting structures.</desc>
<defs><style>
.title{font:700 28px Arial,sans-serif;fill:#f8fafc}.sub{font:16px Arial,sans-serif;fill:#a8b4c7}
.axis{stroke:#94a3b8;stroke-width:2}.grid{stroke:#334155;stroke-width:1}
.value{font:700 22px Arial,sans-serif;fill:#f8fafc}.cat{font:600 18px Arial,sans-serif;fill:#e2e8f0}.tick{font:15px Arial,sans-serif;fill:#a8b4c7}
</style></defs>
<rect width="1100" height="540" rx="20" fill="#0d1117"/>
<text class="title" x="60" y="48">Proposed structure breakdown</text>
<text class="sub" x="60" y="76">44 structures across four categories</text>
<line class="grid" x1="120" y1="150" x2="1010" y2="150"/><line class="grid" x1="120" y1="230" x2="1010" y2="230"/><line class="grid" x1="120" y1="310" x2="1010" y2="310"/>
<line class="axis" x1="120" y1="390" x2="1010" y2="390"/><line class="axis" x1="120" y1="110" x2="120" y2="390"/>
<text class="tick" x="88" y="395">0</text><text class="tick" x="88" y="315">5</text><text class="tick" x="80" y="235">10</text><text class="tick" x="80" y="155">15</text>
<rect x="190" y="150" width="140" height="240" rx="8" fill="#0f9488"/><text class="value" x="260" y="135" text-anchor="middle">15</text>
<rect x="400" y="230" width="140" height="160" rx="8" fill="#3b82f6"/><text class="value" x="470" y="215" text-anchor="middle">10</text>
<rect x="610" y="326" width="140" height="64" rx="8" fill="#f59e0b"/><text class="value" x="680" y="311" text-anchor="middle">4</text>
<rect x="820" y="150" width="140" height="240" rx="8" fill="#8b5cf6"/><text class="value" x="890" y="135" text-anchor="middle">15</text>
<text class="cat" x="260" y="425" text-anchor="middle"><tspan x="260">Academic /</tspan><tspan x="260" dy="23">multipurpose</tspan></text>
<text class="cat" x="470" y="425" text-anchor="middle">Auditoriums</text>
<text class="cat" x="680" y="425" text-anchor="middle">Hostels</text>
<text class="cat" x="890" y="425" text-anchor="middle"><tspan x="890">Residential /</tspan><tspan x="890" dy="23">supporting</tspan></text>
</svg>