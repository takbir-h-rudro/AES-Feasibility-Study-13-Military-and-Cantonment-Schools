<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<defs><style>
.title{font:700 28px Arial,sans-serif;fill:#0f172a}.sub{font:16px Arial,sans-serif;fill:#64748b}
.axis{stroke:#94a3b8;stroke-width:2}.grid{stroke:#e2e8f0;stroke-width:1}
.value{font:700 23px Arial,sans-serif;fill:#0f172a}.cat{font:600 19px Arial,sans-serif;fill:#334155}.tick{font:15px Arial,sans-serif;fill:#64748b}
</style></defs>
<rect width="1000" height="520" rx="20" fill="#ffffff"/>
<text class="title" x="60" y="48">Existing enrollment vs proposed additional capacity</text>
<text class="sub" x="60" y="76">Student counts reported in the feasibility study</text>
<line class="grid" x1="150" y1="150" x2="900" y2="150"/><line class="grid" x1="150" y1="230" x2="900" y2="230"/><line class="grid" x1="150" y1="310" x2="900" y2="310"/>
<line class="axis" x1="150" y1="390" x2="900" y2="390"/><line class="axis" x1="150" y1="110" x2="150" y2="390"/>
<text class="tick" x="115" y="395">0</text><text class="tick" x="92" y="315">10,000</text><text class="tick" x="92" y="235">20,000</text><text class="tick" x="92" y="155">30,000</text>
<rect x="300" y="180" width="180" height="210" rx="8" fill="#2563eb"/><text class="value" x="390" y="163" text-anchor="middle">26,229</text>
<rect x="570" y="266" width="180" height="124" rx="8" fill="#0f766e"/><text class="value" x="660" y="249" text-anchor="middle">15,550</text>
<text class="cat" x="390" y="425" text-anchor="middle"><tspan x="390">Existing student</tspan><tspan x="390" dy="24">enrollment</tspan></text>
<text class="cat" x="660" y="425" text-anchor="middle"><tspan x="660">Proposed additional</tspan><tspan x="660" dy="24">capacity</tspan></text>
<text class="sub" x="60" y="500">Bar width: 180 px · Gap between bars: 90 px (50% of bar width)</text>
</svg>